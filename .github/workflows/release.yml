name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Windows installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Stable, version-less name so the website can link straight to the file:
      # https://github.com/LeVraiLunatix/ragekit/releases/latest/download/Ragekit-Setup.exe
      - name: Add a version-less installer alias
        shell: bash
        run: |
          exe=$(ls release/*/*-setup.exe | head -1)
          cp "$exe" "$(dirname "$exe")/Ragekit-Setup.exe"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release/**/*-setup.exe
            release/**/*-setup.exe.blockmap
            release/**/Ragekit-Setup.exe
            release/**/latest.yml
