appId: one.ragekit.app
productName: Ragekit
copyright: Copyright © 2026 LeVraiLunatix
directories:
  buildResources: build
  output: release/${version}
# Auto-update source. electron-updater reads this to find latest.yml on the
# GitHub Release; the release itself is uploaded by the CI workflow, so the
# build never publishes on its own (dist runs with --publish never).
publish:
  provider: github
  owner: LeVraiLunatix
  repo: ragekit
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/node-unrar-js/dist/js/**
win:
  icon: build/icon.ico
  # A mod manager must write into the GTA V folder, which is usually admin-only
  # (same reason OpenIV requires elevation). Always run elevated.
  requestedExecutionLevel: requireAdministrator
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Ragekit
